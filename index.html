<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>歩行フォームビューア – MediaPipe Pose (Browser)</title>
<style>
  :root {
    --bg: #0D1117;
    --panel: #161C24;
    --border: #232B35;
    --text: #E6EDF3;
    --muted: #8B98A6;
    --accent: #5B8CFF;
    --accent-dim: #3A5CC4;
    --left: #F6AA00;
    --right: #4DC4FF;
    --warn: #F2637B;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    /* Segoe UI carries no Japanese glyphs, so without a Windows Japanese face
       here the kana and kanji fall through to whatever the browser defaults to. */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
            "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    line-height: 1.6; padding: 32px 20px; min-height: 100vh;
  }
  .app { max-width: 820px; margin: 0 auto; }

  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  /* Japanese wraps at any character, so a run of text breaks mid-phrase.
     Each sentence is its own inline-block: the line can only break between
     them, never inside one. */
  .lede { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-break: strict; }
  .lede span { display: inline-block; }

  .drop {
    border: 1px dashed var(--border); border-radius: 10px;
    padding: 56px 20px; text-align: center; background: var(--panel);
  }
  .drop p { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  .check { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; margin-top: 14px; cursor: pointer; }
  .check input { accent-color: var(--accent); }

  button {
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--accent-dim); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.quiet {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 7px 12px; font-weight: 400;
  }
  button.quiet:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
  button.quiet[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .viewer {
    background: #000; border-radius: 10px; overflow: hidden; position: relative;
    margin: 0 auto; --cap: 68vh; --ar: 1.777;
    width: min(100%, calc(var(--cap) * var(--ar)));
  }
  .frame { position: absolute; inset: 0; transform-origin: 0 0; }
  .viewer video, .viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .viewer { touch-action: none; }
  .viewer.zoomed { cursor: grab; }
  .viewer.zoomed:active { cursor: grabbing; }

  .zoomctl { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 2; }
  .zoomctl button {
    background: rgba(13, 17, 23, 0.72); border-color: rgba(230, 237, 243, 0.22);
    padding: 5px 10px; font-size: 13px; line-height: 1.2;
  }
  .viewer.hide-video video { visibility: hidden; }
  .viewer.s-small { --cap: 40vh; }
  .viewer.s-large { --cap: 88vh; }

  #stage.zoom {
    position: fixed; inset: 0; z-index: 50; background: #000;
    padding: 0; margin: 0; display: flex; align-items: center; justify-content: center;
  }
  #stage.zoom .viewer { --cap: 100dvh; border-radius: 0; }
  #stage.zoom .status, #stage.zoom .progress, #stage.zoom .err { display: none; }
  #stage.zoom #scrub, #stage.zoom .transport {
    position: fixed; left: 12px; right: 12px; z-index: 51;
    width: auto; margin: 0; transition: opacity 0.25s;
  }
  #stage.zoom #scrub { bottom: 62px; }
  #stage.zoom .transport {
    bottom: 10px; background: rgba(13, 17, 23, 0.82); border-radius: 9px; padding: 8px;
  }
  #stage.zoom.chrome-off #scrub,
  #stage.zoom.chrome-off .transport,
  #stage.zoom.chrome-off .zoomctl { opacity: 0; pointer-events: none; }
  #stage.zoom .zoomctl { transition: opacity 0.25s; }
  .viewer.mirror video { transform: scaleX(-1); }

  .transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .transport .spacer { flex: 1; }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit;
  }

  input[type=range] { width: 100%; margin: 14px 0 0; accent-color: var(--accent); }

  .status {
    display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline;
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 13px; color: var(--muted);
  }
  .status b { font-family: var(--mono); font-weight: 500; color: var(--text); font-size: 15px; }
  .status .low b { color: var(--warn); }

  .progress { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 12px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }

  .err { color: var(--warn); font-size: 13px; margin: 14px 0 0; }
  .loading { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .loading.error { color: var(--warn); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">

  <h1>歩行フォームビューア</h1>
  <p class="lede"><span>解析はブラウザ内で完結し、動画は送信されません。</span></p>

  <section id="dropZone" class="drop">
    <input type="file" id="fileInput" accept="video/*" hidden />
    <button id="pickBtn">動画を選ぶ</button>
    <p>1人が全身で映っている歩行動画（mp4 / mov / webm）</p>
    <label class="check"><input type="checkbox" id="mirrorInput" /> 左右反転して記録されている（インカメラ撮影など）</label>
    <p id="modelStatus" class="loading">姿勢推定モデルを読み込み中…</p>
  </section>

  <main id="stage" hidden>
    <div class="viewer" id="viewer">
      <div class="frame" id="frame">
        <video id="video" playsinline muted preload="auto"></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="zoomctl">
        <button id="zoomOut" class="quiet" aria-label="縮小">−</button>
        <button id="zoomIn" class="quiet" aria-label="拡大">＋</button>
        <button id="zoomReset" class="quiet" disabled>等倍</button>
      </div>
    </div>

    <div class="progress" id="progressWrap" hidden><i id="progressBar"></i></div>

    <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="再生位置" disabled />

    <div class="transport">
      <button id="playBtn" disabled>再生</button>
      <button id="prevBtn" class="quiet" disabled aria-label="1コマ戻る">◀ コマ</button>
      <button id="nextBtn" class="quiet" disabled aria-label="1コマ進む">コマ ▶</button>
      <select id="speedSelect" disabled aria-label="再生速度">
        <option value="0.25">0.25倍速</option>
        <option value="0.5" selected>0.5倍速</option>
        <option value="1">等倍</option>
      </select>
      <select id="sizeSelect" aria-label="表示サイズ">
        <option value="small">表示：小</option>
        <option value="normal" selected>表示：標準</option>
        <option value="large">表示：大</option>
        <option value="zoom">表示：全画面</option>
      </select>
      <span class="spacer"></span>
      <button id="trailBtn" class="quiet" aria-pressed="false" disabled>足の軌跡</button>
      <button id="maskBtn" class="quiet" aria-pressed="false" disabled>骨格だけ</button>
      <button id="flipBtn" class="quiet" disabled>左右を反転して解析し直す</button>
      <button id="resetBtn" class="quiet">別の動画</button>
    </div>

    <p id="stageError" class="err" hidden></p>

    <div class="status">
      <span>時間 <b id="timeLabel">0.00 / 0.00 s</b></span>
      <span id="qualityWrap">下肢を追跡できたフレーム <b id="qualityLabel">–</b></span>
    </div>
  </main>


</div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const CONFIG = {
  WASM_ROOT: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm",
  MODEL_URL: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
  ANALYSIS_FPS: 24,
  SEEK_TIMEOUT_MS: 3000,
  // A joint below this visibility is treated as not observed.
  VISIBILITY_MIN: 0.6,
  UNSURE_ALPHA: 0.3,
  TRAIL_FRAMES: 24,
  // Clinical gait graphs traditionally plot the left side warm (red) and the
  // right side cool. Green is the classic partner for red but is the worst
  // pairing for red-green colour vision deficiency, so blue takes its place.
  COLORS: { left: "#F6AA00", right: "#4DC4FF", trunk: "#8B98A6" },
};

const LM = {
  L_SHOULDER: 11, R_SHOULDER: 12, L_ELBOW: 13, R_ELBOW: 14, L_WRIST: 15, R_WRIST: 16,
  L_HIP: 23, R_HIP: 24, L_KNEE: 25, R_KNEE: 26, L_ANKLE: 27, R_ANKLE: 28,
  L_HEEL: 29, R_HEEL: 30, L_TOE: 31, R_TOE: 32,
};
const LIMBS = [
  [LM.L_HIP, LM.L_KNEE, LM.L_ANKLE],
  [LM.R_HIP, LM.R_KNEE, LM.R_ANKLE],
];
const LEFT = new Set([11, 13, 15, 23, 25, 27, 29, 31]);
const RIGHT = new Set([12, 14, 16, 24, 26, 28, 30, 32]);
const BONES = [
  [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
  [11, 23], [12, 24], [23, 24],
  [23, 25], [25, 27], [27, 29], [29, 31], [27, 31],
  [24, 26], [26, 28], [28, 30], [30, 32], [28, 32],
];

/* --- Pose model: loading and inference only --- */
const Pose = {
  landmarker: null,
  async load() {
    const vision = await FilesetResolver.forVisionTasks(CONFIG.WASM_ROOT);
    const base = { modelAssetPath: CONFIG.MODEL_URL };
    const opts = (delegate) => ({ baseOptions: { ...base, delegate }, runningMode: "VIDEO", numPoses: 1 });
    try {
      this.landmarker = await PoseLandmarker.createFromOptions(vision, opts("GPU"));
    } catch {
      this.landmarker = await PoseLandmarker.createFromOptions(vision, opts("CPU"));
    }
  },
  detect(source, tMs) { return this.landmarker.detectForVideo(source, tMs); },
};

/* --- Drawing: skeleton and foot trail, no computation --- */
const Draw = {
  clear(ctx, w, h) { ctx.clearRect(0, 0, w, h); },

  // Segments the model is unsure about — typically the far leg in a side-on
  // recording — are drawn faded and dashed. The tracking rate does not fall in
  // that situation, so without this the guesswork would be invisible on screen.
  skeleton(ctx, landmarks, w, h) {
    if (!landmarks) return;
    const solid = Math.max(2, w / 320);
    ctx.lineCap = "round";

    for (const [i, j] of BONES) {
      const a = landmarks[i], b = landmarks[j];
      if (!a || !b) continue;
      const sure = Math.min(a.visibility ?? 0, b.visibility ?? 0) >= CONFIG.VISIBILITY_MIN;
      ctx.globalAlpha = sure ? 1 : CONFIG.UNSURE_ALPHA;
      ctx.lineWidth = sure ? solid : solid * 0.8;
      ctx.setLineDash(sure ? [] : [solid * 1.6, solid * 1.6]);
      ctx.strokeStyle = LEFT.has(i) && LEFT.has(j) ? CONFIG.COLORS.left
        : RIGHT.has(i) && RIGHT.has(j) ? CONFIG.COLORS.right
        : CONFIG.COLORS.trunk;
      ctx.beginPath();
      ctx.moveTo(a.x * w, a.y * h);
      ctx.lineTo(b.x * w, b.y * h);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    for (const idx of Object.values(LM)) {
      const p = landmarks[idx];
      if (!p) continue;
      const sure = (p.visibility ?? 0) >= CONFIG.VISIBILITY_MIN;
      ctx.globalAlpha = sure ? 1 : CONFIG.UNSURE_ALPHA;
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, Math.max(3, w / 220) * (sure ? 1 : 0.75), 0, Math.PI * 2);
      ctx.fillStyle = LEFT.has(idx) ? CONFIG.COLORS.left : RIGHT.has(idx) ? CONFIG.COLORS.right : CONFIG.COLORS.trunk;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  },


  // Fades the recent path of both toes. Asymmetric swing shows up as two
  // trails of different length without putting a number on it. Segments the
  // model is unsure about are left out rather than dashed: the trail already
  // uses opacity to convey time, and a second visual code on the same line
  // would be unreadable.
  trail(ctx, frames, upto, w, h) {
    const from = Math.max(0, upto - CONFIG.TRAIL_FRAMES);
    ctx.lineWidth = Math.max(1.5, w / 480);
    for (const [idx, color] of [[LM.L_TOE, CONFIG.COLORS.left], [LM.R_TOE, CONFIG.COLORS.right]]) {
      for (let i = from + 1; i <= upto; i++) {
        const a = frames[i - 1].landmarks, b = frames[i].landmarks;
        if (!a || !b) continue;
        if (Math.min(a[idx].visibility ?? 0, b[idx].visibility ?? 0) < CONFIG.VISIBILITY_MIN) continue;
        ctx.globalAlpha = 0.15 + 0.55 * ((i - from) / CONFIG.TRAIL_FRAMES);
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(a[idx].x * w, a[idx].y * h);
        ctx.lineTo(b[idx].x * w, b[idx].y * h);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  },
};

/* --- DOM --- */
const el = (id) => document.getElementById(id);
const dom = {
  dropZone: el("dropZone"), pickBtn: el("pickBtn"), fileInput: el("fileInput"), modelStatus: el("modelStatus"),
  mirrorInput: el("mirrorInput"), flipBtn: el("flipBtn"), sizeSelect: el("sizeSelect"),
  stage: el("stage"), viewer: el("viewer"), video: el("video"), overlay: el("overlay"),
  progressWrap: el("progressWrap"), progressBar: el("progressBar"), scrub: el("scrub"),
  playBtn: el("playBtn"), prevBtn: el("prevBtn"), nextBtn: el("nextBtn"), speedSelect: el("speedSelect"),
  trailBtn: el("trailBtn"), maskBtn: el("maskBtn"), resetBtn: el("resetBtn"),
  frame: el("frame"), zoomIn: el("zoomIn"), zoomOut: el("zoomOut"), zoomReset: el("zoomReset"),
  stageError: el("stageError"), timeLabel: el("timeLabel"), qualityWrap: el("qualityWrap"), qualityLabel: el("qualityLabel"),
};

const ctx = dom.overlay.getContext("2d");
// The video frame is copied here before detection. drawImage() samples the
// browser's already rotation-corrected frame, so phone videos carrying
// rotation metadata are analyzed in the orientation they are displayed in.
const buffer = document.createElement("canvas");
const bufferCtx = buffer.getContext("2d", { willReadFrequently: true });

// detectForVideo() requires timestamps that only ever increase. Video time
// restarts at 0 on every analysis pass, so the clock handed to the model is
// kept separate from the clock shown to the user.
let detectStamp = 0;

const state = { modelReady: false, frames: [], ready: false, playing: false, trail: false, mirror: false, url: null };

/* --- Model boot --- */
(async () => {
  try {
    await Pose.load();
    state.modelReady = true;
    dom.modelStatus.textContent = "モデルの準備ができました";
  } catch (err) {
    dom.modelStatus.textContent = "モデルを読み込めませんでした。通信環境を確認して再読み込みしてください。";
    dom.modelStatus.classList.add("error");
    console.error(err);
  }
})();

/* --- File selection --- */
dom.pickBtn.addEventListener("click", () => dom.fileInput.click());
dom.fileInput.addEventListener("change", async () => {
  const file = dom.fileInput.files[0];
  if (!file) return;
  if (!state.modelReady) { dom.modelStatus.textContent = "モデルの読み込みが終わるまで待ってください"; return; }
  reset();
  state.mirror = dom.mirrorInput.checked;
  state.url = URL.createObjectURL(file);
  dom.video.src = state.url;
  dom.video.load();
  await once(dom.video, "loadedmetadata");
  fitToVideo();
  dom.dropZone.hidden = true;
  dom.stage.hidden = false;
  await analyze();
});

function once(target, type, timeout = 15000) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(type + " が来ませんでした")), timeout);
    target.addEventListener(type, () => { clearTimeout(timer); resolve(); }, { once: true });
  });
}

function fitToVideo() {
  const w = dom.video.videoWidth || 640;
  const h = dom.video.videoHeight || 360;

  const scale = Math.min(1, 720 / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * scale));
  const ch = Math.max(1, Math.round(h * scale));

  dom.overlay.width = buffer.width = cw;
  dom.overlay.height = buffer.height = ch;

  dom.viewer.style.aspectRatio = `${w} / ${h}`;
  dom.viewer.style.setProperty("--ar", String(w / h));
}

/* --- Analysis pass: record landmarks once, then never run the model again --- */
function seekTo(video, t) {
  return new Promise((resolve) => {
    // Assigning the current value fires no "seeked" event, which would leave us
    // waiting for the timeout on every no-op seek.
    if (Math.abs(video.currentTime - t) < 1e-3) { resolve(); return; }
    let done = false;
    const finish = () => { if (done) return; done = true; video.removeEventListener("seeked", finish); clearTimeout(timer); resolve(); };
    const timer = setTimeout(finish, CONFIG.SEEK_TIMEOUT_MS);
    video.addEventListener("seeked", finish);
    video.currentTime = t;
  });
}

// When the source is mirrored we flip it here, before detection. Correcting it
// only on screen would leave the model's left/right assignment reversed.
function grabFrame() {
  bufferCtx.save();
  if (state.mirror) { bufferCtx.translate(buffer.width, 0); bufferCtx.scale(-1, 1); }
  bufferCtx.drawImage(dom.video, 0, 0, buffer.width, buffer.height);
  bufferCtx.restore();
}

function applyMirror() {
  dom.viewer.classList.toggle("mirror", state.mirror);
}

async function analyze() {
  state.frames = [];
  state.ready = false;
  dom.stageError.hidden = true;
  enableTransport(false);
  applyMirror();
  dom.progressWrap.hidden = false;
  dom.video.pause();
  const step = 1 / CONFIG.ANALYSIS_FPS;
  const duration = dom.video.duration;

  try {
  for (let t = 0; t <= duration; t += step) {
    await seekTo(dom.video, t);
    grabFrame();
    detectStamp += 1000 / CONFIG.ANALYSIS_FPS;
    const result = Pose.detect(buffer, detectStamp);
    const landmarks = result.landmarks?.[0] ?? null;
    state.frames.push({ t, landmarks, visible: isVisible(landmarks) });

    const pct = Math.min(100, (t / duration) * 100);
    dom.progressBar.style.width = pct + "%";
    render(state.frames.length - 1);
  }

  } catch (err) {
    dom.stageError.textContent = "解析を最後まで実行できませんでした。別の動画で試すか、ページを再読み込みしてください。";
    dom.stageError.hidden = false;
    console.error(err);
  } finally {
    dom.progressWrap.hidden = true;
    enableTransport(true);
    dom.flipBtn.disabled = false;
  }

  state.ready = state.frames.length > 1;
  showQuality();
  await seekTo(dom.video, 0);
  renderAt(0);
}

// A frame counts as tracked when at least one leg is visible from hip to ankle.
// Requiring both would fail almost every side-on recording, where the far leg is
// occluded by the near one — which is normal for that view, not a bad shot.
function isVisible(landmarks) {
  if (!landmarks) return false;
  return LIMBS.some((limb) => limb.every((i) => (landmarks[i]?.visibility ?? 0) >= CONFIG.VISIBILITY_MIN));
}

function showQuality() {
  const total = state.frames.length;
  const ok = state.frames.filter((f) => f.visible).length;
  const pct = total ? Math.round((ok / total) * 100) : 0;
  dom.qualityLabel.textContent = `${pct}%`;
  dom.qualityWrap.classList.toggle("low", pct < 70);
}

/* --- Playback --- */
function indexAt(t) {
  let lo = 0, hi = state.frames.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (state.frames[mid].t < t) lo = mid + 1; else hi = mid;
  }
  if (lo > 0 && Math.abs(state.frames[lo - 1].t - t) < Math.abs(state.frames[lo].t - t)) lo--;
  return lo;
}

function render(i) {
  const frame = state.frames[i];
  if (!frame) return;
  Draw.clear(ctx, dom.overlay.width, dom.overlay.height);
  if (state.trail) Draw.trail(ctx, state.frames, i, dom.overlay.width, dom.overlay.height);
  Draw.skeleton(ctx, frame.landmarks, dom.overlay.width, dom.overlay.height);
}

function renderAt(t) {
  render(indexAt(t));
  const d = dom.video.duration || 0;
  dom.timeLabel.textContent = `${t.toFixed(2)} / ${d.toFixed(2)} s`;
  dom.scrub.value = d ? Math.round((t / d) * 1000) : 0;
}

let lastIndex = -1;

function loop() {
  if (!state.playing) return;
  const i = indexAt(dom.video.currentTime);
  if (i !== lastIndex) {
    lastIndex = i;
    renderAt(dom.video.currentTime);
  }
  requestAnimationFrame(loop);
}
  
dom.playBtn.addEventListener("click", () => {
  if (dom.video.paused) {
    dom.video.playbackRate = parseFloat(dom.speedSelect.value);
    dom.video.play();
  } else {
    dom.video.pause();
  }
});
dom.video.addEventListener("play", () => { state.playing = true; dom.playBtn.textContent = "一時停止"; lastIndex = -1; loop(); });
dom.video.addEventListener("pause", () => { state.playing = false; dom.playBtn.textContent = "再生"; renderAt(dom.video.currentTime); });
dom.video.addEventListener("ended", () => { state.playing = false; dom.playBtn.textContent = "再生"; });
dom.speedSelect.addEventListener("change", () => { dom.video.playbackRate = parseFloat(dom.speedSelect.value); });

async function stepBy(delta) {
  dom.video.pause();
  const step = 1 / CONFIG.ANALYSIS_FPS;
  const next = Math.min(dom.video.duration, Math.max(0, dom.video.currentTime + delta * step));
  await seekTo(dom.video, next);
  renderAt(next);
}
dom.prevBtn.addEventListener("click", () => stepBy(-1));
dom.nextBtn.addEventListener("click", () => stepBy(1));

dom.scrub.addEventListener("input", async () => {
  dom.video.pause();
  const t = (dom.scrub.value / 1000) * (dom.video.duration || 0);
  await seekTo(dom.video, t);
  renderAt(t);
});

dom.trailBtn.addEventListener("click", () => {
  state.trail = !state.trail;
  dom.trailBtn.setAttribute("aria-pressed", String(state.trail));
  renderAt(dom.video.currentTime);
});

dom.maskBtn.addEventListener("click", () => {
  const on = dom.viewer.classList.toggle("hide-video");
  dom.maskBtn.setAttribute("aria-pressed", String(on));
});

/* --- Reset --- */
function enableTransport(on) {
  for (const b of [dom.playBtn, dom.prevBtn, dom.nextBtn, dom.speedSelect, dom.trailBtn, dom.maskBtn, dom.scrub]) {
    b.disabled = !on;
  }
}

function reset() {
  if (state.url) URL.revokeObjectURL(state.url);
  Object.assign(state, { frames: [], ready: false, playing: false, trail: false, mirror: false, url: null });
  dom.video.pause();
  dom.video.removeAttribute("src");
  dom.video.load();
  dom.viewer.classList.remove("hide-video", "mirror");
  resetView();
  dom.sizeSelect.value = "normal";
  applySize("normal");
  dom.flipBtn.disabled = true;
  dom.trailBtn.setAttribute("aria-pressed", "false");
  dom.maskBtn.setAttribute("aria-pressed", "false");
  dom.qualityLabel.textContent = "–";
  dom.qualityWrap.classList.remove("low");
  dom.timeLabel.textContent = "0.00 / 0.00 s";
  dom.progressBar.style.width = "0";
  lastIndex = -1;
  dom.stageError.hidden = true;
  enableTransport(false);
  Draw.clear(ctx, dom.overlay.width, dom.overlay.height);
}


/* --- Zoom and pan. The transform sits on the wrapper holding both the video
   and the overlay canvas, so the skeleton stays registered to the image at any
   magnification. --- */
const ZOOM = { MAX: 6, STEP: 1.35 };
const view = { k: 1, tx: 0, ty: 0 };

function applyView() {
  dom.frame.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.k})`;
  const zoomed = view.k > 1.001;
  dom.viewer.classList.toggle("zoomed", zoomed);
  dom.zoomReset.disabled = !zoomed;
}

function clampView() {
  const r = dom.viewer.getBoundingClientRect();
  view.tx = Math.min(0, Math.max(r.width * (1 - view.k), view.tx));
  view.ty = Math.min(0, Math.max(r.height * (1 - view.k), view.ty));
}

// Keeps the point under the cursor or pinch centre fixed while scaling.
function zoomAt(factor, cx, cy) {
  const prev = view.k;
  view.k = Math.min(ZOOM.MAX, Math.max(1, prev * factor));
  const ratio = view.k / prev;
  view.tx = cx - (cx - view.tx) * ratio;
  view.ty = cy - (cy - view.ty) * ratio;
  clampView();
  applyView();
}

function zoomCentre(factor) {
  const r = dom.viewer.getBoundingClientRect();
  zoomAt(factor, r.width / 2, r.height / 2);
}

function resetView() { view.k = 1; view.tx = 0; view.ty = 0; applyView(); }

dom.zoomIn.addEventListener("click", () => zoomCentre(ZOOM.STEP));
dom.zoomOut.addEventListener("click", () => zoomCentre(1 / ZOOM.STEP));
dom.zoomReset.addEventListener("click", resetView);

dom.viewer.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = dom.viewer.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

// One pointer pans, two pinch. Pointer events cover mouse and touch alike.
const pointers = new Map();
let pinchDist = 0;

dom.viewer.addEventListener("pointerdown", (e) => {
  dom.viewer.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) pinchDist = spread();
});

dom.viewer.addEventListener("pointermove", (e) => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size >= 2) {
    const dist = spread();
    if (pinchDist > 0) {
      const r = dom.viewer.getBoundingClientRect();
      const c = centre();
      zoomAt(dist / pinchDist, c.x - r.left, c.y - r.top);
    }
    pinchDist = dist;
  } else if (view.k > 1.001) {
    view.tx += dx;
    view.ty += dy;
    clampView();
    applyView();
  }
});

for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
  dom.viewer.addEventListener(type, (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;
  });
}

function spread() {
  const [a, b] = [...pointers.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}
function centre() {
  const [a, b] = [...pointers.values()];
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

/* --- In full-window mode the controls fade out so only the footage is left. --- */
let chromeTimer = null;
function wakeChrome() {
  if (!dom.stage.classList.contains("zoom")) return;
  dom.stage.classList.remove("chrome-off");
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(() => dom.stage.classList.add("chrome-off"), 2600);
}
for (const type of ["pointermove", "pointerdown", "keydown"]) {
  document.addEventListener(type, wakeChrome);
}

/* --- Display size. "zoom" fills the window rather than calling the Fullscreen
   API, which iOS Safari only exposes for the native video player — and that
   player would cover the skeleton overlay. --- */
function applySize(mode) {
  dom.viewer.classList.toggle("s-small", mode === "small");
  dom.viewer.classList.toggle("s-large", mode === "large");
  dom.stage.classList.toggle("zoom", mode === "zoom");
  dom.stage.classList.remove("chrome-off");
  if (mode === "zoom") wakeChrome(); else clearTimeout(chromeTimer);
  clampView();
  applyView();
  renderAt(dom.video.currentTime);
}
dom.sizeSelect.addEventListener("change", () => applySize(dom.sizeSelect.value));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && dom.stage.classList.contains("zoom")) {
    dom.sizeSelect.value = "normal";
    applySize("normal");
  }
});

dom.flipBtn.addEventListener("click", async () => {
  state.mirror = !state.mirror;
  dom.mirrorInput.checked = state.mirror;
  dom.video.pause();
  dom.flipBtn.disabled = true;
  await analyze();
});

dom.resetBtn.addEventListener("click", () => {
  reset();
  dom.stage.hidden = true;
  dom.dropZone.hidden = false;
  dom.fileInput.value = "";
});
</script>
</body>
</html>
